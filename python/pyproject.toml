[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastn-ai"
version = "0.5.0"
description = "fastn: embedded integrations for multi-tenant SaaS and AI agents. Let your customers connect their own apps inside your product, through one API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Fastn", email = "support@fastn.ai" },
]
keywords = [
    "fastn", "sdk", "embedded integrations", "embedded ipaas", "integration platform",
    "unified api", "multi-tenant", "saas", "customer integrations", "oauth",
    "crm api", "calendar api", "webhooks", "mcp", "claude", "anthropic", "openai",
    "ai-agents", "llm", "tool-use", "function-calling",
    "hubspot", "salesforce", "google calendar", "slack", "jira", "github",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.0,<1.0",
]

[project.optional-dependencies]
cli = [
    "click>=7.0",
    "rich>=13.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "jinja2>=3.0",
    "click>=7.0",
    "rich>=13.0",
]
generator = [
    "jinja2>=3.0",
]

[project.scripts]
fastn = "fastn._cli_entry:main"

[project.urls]
Homepage = "https://fastn.ai"
Documentation = "https://docs.fastn.ai"
Repository = "https://github.com/fastn-ai/fastn-sdk"
Changelog = "https://github.com/fastn-ai/fastn-sdk/blob/main/python/CHANGELOG.md"
Issues = "https://github.com/fastn-ai/fastn-sdk/issues"
"Embedding guide" = "https://docs.fastn.ai/embed/embedding"
"MCP gateway" = "https://docs.fastn.ai/build/mcp-gateway"
Pricing = "https://fastn.ai/pricing"
"llms.txt" = "https://fastn.ai/llms.txt"

[tool.hatch.build.targets.wheel]
packages = ["fastn"]

[tool.hatch.build.targets.sdist]
include = ["fastn/", "fastn/py.typed", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests/sdk", "tests/cli", "tests/platform"]
asyncio_mode = "auto"
markers = [
    "sdk: SDK core tests (client, config, connector, exceptions, auth, oauth)",
    "cli: CLI command and helper tests",
    "platform: fastn.platform (platform REST API client) tests",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
