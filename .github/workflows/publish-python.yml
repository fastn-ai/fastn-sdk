name: Publish Python SDK

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: python
      - name: Run tests
        run: pytest tests/ -v
        working-directory: python

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#python/v}"
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '^__version__ = ' fastn/__init__.py | cut -d'"' -f2)
          echo "tag=$tag pyproject=$version fastn.__version__=$init"
          test "$tag" = "$version" && test "$tag" = "$init"
        working-directory: python
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
        working-directory: python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
